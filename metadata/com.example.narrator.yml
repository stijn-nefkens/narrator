AutoName: Narrator
Description: |
    Narrator is an audiobook player for EPUB files. Designed for /e/OS and de-Googled
    Android devices, but works on any Android 8.0+ phone.

    Everything runs on the device — no network access, no analytics, no tracking, no
    cloud sync. Books, bookmarks and progress never leave the phone.

    The app uses the on-device TextToSpeech engine of your choice; sherpa-onnx with
    Kokoro is recommended for natural neural narration.

